name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Monorepo Git Status ${{ steps.get_version.outputs.VERSION }}

            ### 更新内容
            请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)

            ### 安装方式
            1. 下载下方的 `monorepo-git-status-${{ steps.get_version.outputs.VERSION }}.zip`
            2. 在 IDE 中：Settings → Plugins → ⚙️ → Install Plugin from Disk
            3. 选择下载的 ZIP 文件并重启 IDE

            或者直接在 JetBrains Marketplace 搜索安装！

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/distributions/monorepo-git-status-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: monorepo-git-status-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
